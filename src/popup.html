<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>pr+</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      padding: 12px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #1f2328;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #656d76;
    }
    input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    input:focus {
      outline: 2px solid #0969da44;
      border-color: #0969da;
    }
    .saved {
      margin: 6px 0 0;
      font-size: 11px;
      color: #656d76;
    }
    .saved code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.03em;
    }
    .row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
    }
    button {
      padding: 5px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      font-size: 12px;
      cursor: pointer;
    }
    button.primary {
      background: #0969da;
      border-color: #0969da;
      color: #fff;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status {
      flex: 1;
      min-height: 1.2em;
      font-size: 11px;
      color: #656d76;
    }
    #status.err { color: #cf222e; }
    .hint {
      margin: 8px 0 0;
      font-size: 11px;
      color: #656d76;
    }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>pr+</h1>
  <label for="token">API token (private repo)</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_… / github_pat_…" />
  <p id="token-saved" class="saved" hidden>Saved: <code id="token-mask"></code></p>
  <div class="row">
    <button id="save" class="primary" type="button">Save</button>
    <button id="clear" type="button">Clear</button>
    <span id="status"></span>
  </div>
  <p class="hint">
    <a href="https://github.com/settings/tokens" target="_blank" rel="noreferrer">Create token</a>
    · repo / PR read · stored only in this extension’s local storage (not synced)
  </p>

  <script src="popup.js"></script>
</body>
</html>
