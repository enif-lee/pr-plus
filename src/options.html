<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>GitHub PR Tree — Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      max-width: 560px;
      margin: 32px auto;
      padding: 0 16px;
      color: #1f2328;
      line-height: 1.5;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #656d76; font-size: 14px; }
    label { display: block; font-weight: 600; margin: 20px 0 8px; font-size: 14px; }
    input[type="password"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 14px;
    }
    .actions { margin-top: 16px; display: flex; gap: 8px; align-items: center; }
    button {
      padding: 6px 14px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      cursor: pointer;
      font-size: 14px;
    }
    button.primary { background: #0969da; color: #fff; border-color: #0969da; }
    #status { font-size: 13px; color: #656d76; min-height: 1.2em; }
    a { color: #0969da; }
    code { font-size: 13px; background: #f6f8fa; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>GitHub PR Tree</h1>
  <p>
    Private repository에서 PR branch 정보를 가져오려면 GitHub Personal Access Token이 필요합니다.
    <a href="https://github.com/settings/tokens" target="_blank" rel="noreferrer">토큰 발급</a>
  </p>
  <p>권한: private repo 접근 시 <code>repo</code> scope (classic) 또는 fine-grained에서 해당 repo Pull requests 읽기.</p>

  <label for="token">GitHub API Token</label>
  <input id="token" type="password" autocomplete="off" placeholder="ghp_... 또는 github_pat_..." />

  <div class="actions">
    <button id="save" class="primary" type="button">Save</button>
    <button id="clear" type="button">Clear</button>
    <span id="status"></span>
  </div>

  <script src="storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
