name: demo-reviews
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        required: false
        default: 'false'

jobs:
  submit-demo-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Submit demo reviews
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // Map: some Approved, some Changes Requested; rest stay Review required (no review)
            const plan = [
              { number: 1, event: 'APPROVE', body: 'Demo: approved for screenshot.' },
              { number: 2, event: 'REQUEST_CHANGES', body: 'Demo: please address these notes.' },
              { number: 6, event: 'APPROVE', body: 'Demo: LGTM.' },
              { number: 7, event: 'REQUEST_CHANGES', body: 'Demo: needs follow-up.' },
              { number: 9, event: 'APPROVE', body: 'Demo: approved.' },
            ];
            for (const item of plan) {
              try {
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number: item.number,
                  event: item.event,
                  body: item.body,
                });
                console.log(`OK #${item.number} ${item.event}`);
              } catch (e) {
                console.log(`FAIL #${item.number} ${item.event}: ${e.message}`);
              }
            }
